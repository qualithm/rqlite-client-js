# Generated by dx/scripts/branch-sync from ci-templates/sync-branches.yaml.
# Do not edit directly — change the template and re-run branch-sync.

name: Sync Branches

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [test, main]
  # A missed push run leaves test/development behind main until the next
  # promotion goes DIRTY. The daily run executes on the default branch, so it
  # takes the main path below and realigns whatever a missed push left behind.
  schedule:
    - cron: "17 5 * * *" # Daily at 05:17 UTC
  workflow_dispatch: {}

concurrency:
  group: sync-${{ github.ref_name }}
  # A scheduled run queues behind an in-flight push run instead of cancelling it.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write

jobs:
  guard:
    name: Source Branch
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Enforce promotion path
        # The head branch name is chosen by whoever opens the PR, so it reaches
        # the script through env, never as an expanded expression.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          base="$BASE_REF"
          head="$HEAD_REF"
          case "$base" in
            test) allowed="development" ;;
            main) allowed="test" ;;
            *) echo "::error::unhandled base branch $base"; exit 1 ;;
          esac
          if [[ "$head" != "$allowed" ]]; then
            echo "::error::PRs into $base must come from $allowed, not $head"
            exit 1
          fi
  sync:
    name: Sync downstream branches
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # This job pushes test/development with the CI App token, and unlike
    # GITHUB_TOKEN those pushes trigger workflows, so skip the App's own push to
    # test. A push to main is always a promotion and always runs, whoever merged
    # it. A promotion into test merged by the App is skipped too; the daily
    # schedule realigns development onto it. A scheduled run's actor is whoever
    # last edited the cron line, so the guard never skips it. A pull_request run
    # has nothing to sync (its ref is the PR merge ref), so it never starts.
    if: >-
      github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.ref_name ==
      'main' || github.actor != 'qualithm-ci[bot]')
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Keep test branch ancestry aligned with main to avoid cumulative merge commits.
      # A push to main is a test → main promotion that just merged, so test
      # resets unconditionally. A scheduled or manual run is catching a missed
      # push and may find a development → test promotion still awaiting its
      # test → main hop; it resets only when nothing on test would be lost —
      # test is an ancestor of main, or its tree already equals main's (the
      # pre-squash copy of a promotion main already carries).
      - name: Reset test to main
        id: reset-test
        if: github.ref_name == 'main'
        run: |
          git checkout test
          if [ "$(git rev-parse origin/test)" = "$(git rev-parse origin/main)" ]; then
            echo "test already equals main — nothing to push"
            echo "aligned=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ] \
            && ! git merge-base --is-ancestor origin/test origin/main \
            && ! git diff --quiet origin/main origin/test; then
            if git merge-base --is-ancestor origin/main origin/test; then
              echo "test is ahead of main (a promotion awaiting its test → main hop) — left untouched"
            else
              echo "test is behind main and carries changes main lacks — left untouched, failing the run after the development realign"
              echo "diverged=true" >> "$GITHUB_OUTPUT"
            fi
            echo "aligned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git reset --hard origin/main
          git push --force-with-lease origin test
          echo "test reset onto main"
          echo "aligned=true" >> "$GITHUB_OUTPUT"

      - name: Realign development onto main
        if: github.ref_name == 'main' && steps.reset-test.outputs.aligned == 'true'
        run: |
          git checkout development
          # A squash merge collapses a PR's N commits into one, so the promoted
          # commits are NOT patch-equivalent to any single development commit and a
          # plain rebase cannot drop them — it conflicts, aborts, and leaves
          # development to accumulate. When the squash has drained development (its
          # tree now matches main) adopt main's clean linear history outright; only
          # genuinely-unpromoted work (differing trees) is preserved via rebase, and
          # because the drained case keeps development linear that rebase no longer
          # trips over stale merge commits.
          if git diff --quiet origin/main development; then
            if [ "$(git rev-parse development)" = "$(git rev-parse origin/main)" ]; then
              echo "development already aligned with main — nothing to push"
            else
              git reset --hard origin/main
              git push --force-with-lease origin development
              echo "development reset onto main (identical trees)"
            fi
          else
            before=$(git rev-parse development)
            if git rebase origin/main; then
              if [ "$before" = "$(git rev-parse development)" ]; then
                echo "development already aligned with main — nothing to push"
              else
                git push --force-with-lease origin development
                echo "development realigned onto main"
              fi
            else
              conflicts=$(git diff --name-only --diff-filter=U | paste -sd ' ' -)
              git rebase --abort
              echo "::error::${{ github.repository }}: development conflicts with main in ${conflicts:-(no conflicting files reported)} — rebase aborted, development left untouched for manual resolution"
              exit 1
            fi
          fi

      # When test advances, realign development onto it so its base does not rot.
      # A main-path run that left test untouched realigns onto test for the same reason.
      - name: Realign development onto test
        if: >-
          github.ref_name == 'test' || (github.ref_name == 'main' &&
          steps.reset-test.outputs.aligned == 'false')
        run: |
          git checkout development
          # A squash merge collapses a PR's N commits into one, so the promoted
          # commits are NOT patch-equivalent to any single development commit and a
          # plain rebase cannot drop them — it conflicts, aborts, and leaves
          # development to accumulate. When the squash has drained development (its
          # tree now matches test) adopt test's clean linear history outright; only
          # genuinely-unpromoted work (differing trees) is preserved via rebase, and
          # because the drained case keeps development linear that rebase no longer
          # trips over stale merge commits.
          if git diff --quiet origin/test development; then
            if [ "$(git rev-parse development)" = "$(git rev-parse origin/test)" ]; then
              echo "development already aligned with test — nothing to push"
            else
              git reset --hard origin/test
              git push --force-with-lease origin development
              echo "development reset onto test (identical trees)"
            fi
          else
            before=$(git rev-parse development)
            if git rebase origin/test; then
              if [ "$before" = "$(git rev-parse development)" ]; then
                echo "development already aligned with test — nothing to push"
              else
                git push --force-with-lease origin development
                echo "development realigned onto test"
              fi
            else
              conflicts=$(git diff --name-only --diff-filter=U | paste -sd ' ' -)
              git rebase --abort
              echo "::error::${{ github.repository }}: development conflicts with test in ${conflicts:-(no conflicting files reported)} — rebase aborted, development left untouched for manual resolution"
              exit 1
            fi
          fi

      # Runs after the development realign so a diverged test still gets
      # development rebased onto it, then fails the run so a person sees it.
      - name: Fail on diverged test
        if: ${{ !cancelled() && steps.reset-test.outputs.diverged == 'true' }}
        run: |
          echo "::error::${{ github.repository }}: test is behind main and carries changes main lacks — resolve manually"
          exit 1
