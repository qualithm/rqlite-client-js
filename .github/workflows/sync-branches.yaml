# Generated by dx/scripts/branch-sync from ci-templates/sync-branches.yaml.
# Do not edit directly — change the template and re-run branch-sync.

name: Sync Branches

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [test, main]
  # A missed push run leaves test/development behind main until the next
  # promotion goes DIRTY. The daily run executes on the default branch, so it
  # takes the main path below and realigns whatever a missed push left behind.
  schedule:
    - cron: "17 5 * * *" # Daily at 05:17 UTC
  workflow_dispatch: {}

concurrency:
  group: sync-${{ github.ref_name }}
  # A scheduled run queues behind an in-flight push run instead of cancelling it.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write

jobs:
  guard:
    name: Source Branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Enforce promotion path
        # The head branch name is chosen by whoever opens the PR, so it reaches
        # the script through env, never as an expanded expression.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          base="$BASE_REF"
          head="$HEAD_REF"
          case "$base" in
            test) allowed="development" ;;
            main) allowed="test" ;;
            *) echo "::error::unhandled base branch $base"; exit 1 ;;
          esac
          if [[ "$head" != "$allowed" ]]; then
            echo "::error::PRs into $base must come from $allowed, not $head"
            exit 1
          fi
  sync:
    name: Sync downstream branches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This job pushes test/development with the CI App token, and unlike
    # GITHUB_TOKEN those pushes trigger workflows, so skip the App's own push to
    # test. A push to main is always a promotion and always runs, whoever merged
    # it. A promotion into test merged by the App is skipped too; the daily
    # schedule realigns development onto it. A scheduled run's actor is whoever
    # last edited the cron line, so the guard never skips it. A pull_request run
    # has nothing to sync (its ref is the PR merge ref), so it never starts.
    if: >-
      github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.ref_name ==
      'main' || github.actor != 'qualithm-ci[bot]')
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # push-branch retries a push the remote rejects transiently (a GitHub-side
      # error, not a lease failure), so one bad push no longer leaves the
      # branches unsynced until the next promotion.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/push-branch" <<'EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          for attempt in 1 2 3 4; do
            git push --force-with-lease origin "$1" && exit 0
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::push of $1 failed (attempt $attempt of 4), retrying"
              sleep $((attempt * 10))
            fi
          done
          echo "::error::push of $1 failed after 4 attempts"
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/bin/push-branch"
          # realign-development TARGET rebases development onto origin/TARGET
          # after a squash promotion. Shared by both realign steps below.
          cat > "$RUNNER_TEMP/bin/realign-development" <<'EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          target="$1"
          upstream="origin/$target"
          git checkout -q development || exit 1
          # A squash merge collapses a PR's N commits into one, so the promoted
          # commits are NOT patch-equivalent to any single development commit and a
          # plain rebase cannot drop them — it conflicts. When the squash has
          # drained development (its tree now matches the target) adopt the
          # target's clean linear history outright.
          if git diff --quiet "$upstream" development; then
            if [ "$(git rev-parse development)" = "$(git rev-parse "$upstream")" ]; then
              echo "development already aligned with $target — nothing to push"
            else
              git reset -q --hard "$upstream"
              push-branch development || exit 1
              echo "development reset onto $target (identical trees)"
            fi
            exit 0
          fi
          before=$(git rev-parse development)
          before_tree=$(git rev-parse "development^{tree}")
          # Commits landed after the promotion. The newest development commit whose
          # tree equals the target's is the tip of what the squash promoted, so
          # replay only the commits after it. The result must keep development's
          # tree; anything else falls through to the plain rebase below.
          promoted=$(git log --format='%H %T' "$upstream..development" \
            | awk -v tree="$(git rev-parse "$upstream^{tree}")" '$2 == tree { print $1; exit }')
          if [ -n "$promoted" ]; then
            if git rebase -q --onto "$upstream" "$promoted" development \
              && [ "$(git rev-parse "development^{tree}")" = "$before_tree" ]; then
              push-branch development || exit 1
              echo "development realigned onto $target, replaying the commits after the promoted $(git rev-parse --short "$promoted")"
              exit 0
            fi
            git rebase --abort 2>/dev/null
            git checkout -q development
            git reset -q --hard "$before"
            echo "replaying the commits after the promoted $(git rev-parse --short "$promoted") did not keep development's tree — trying a plain rebase"
          fi
          if git rebase -q "$upstream"; then
            if [ "$before" = "$(git rev-parse development)" ]; then
              echo "development already aligned with $target — nothing to push"
            else
              push-branch development || exit 1
              echo "development realigned onto $target"
            fi
            exit 0
          fi
          conflicts=$(git diff --name-only --diff-filter=U | paste -sd ' ' -)
          git rebase --abort
          echo "::error::${GITHUB_REPOSITORY:-this repository}: development conflicts with $target in ${conflicts:-(no conflicting files reported)} — rebase aborted, development left untouched for manual resolution"
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/bin/realign-development"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Keep test branch ancestry aligned with main to avoid cumulative merge commits.
      # A push to main is a test → main promotion that just merged, so test
      # resets unconditionally. A scheduled or manual run is catching a missed
      # push and may find a development → test promotion still awaiting its
      # test → main hop; it resets only when nothing on test would be lost —
      # test is an ancestor of main, or its tree already equals main's (the
      # pre-squash copy of a promotion main already carries).
      - name: Reset test to main
        id: reset-test
        if: github.ref_name == 'main'
        run: |
          git checkout test
          if [ "$(git rev-parse origin/test)" = "$(git rev-parse origin/main)" ]; then
            echo "test already equals main — nothing to push"
            echo "aligned=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ] \
            && ! git merge-base --is-ancestor origin/test origin/main \
            && ! git diff --quiet origin/main origin/test; then
            if git merge-base --is-ancestor origin/main origin/test; then
              echo "test is ahead of main (a promotion awaiting its test → main hop) — left untouched"
            else
              echo "test is behind main and carries changes main lacks — left untouched, failing the run after the development realign"
              echo "diverged=true" >> "$GITHUB_OUTPUT"
            fi
            echo "aligned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git reset --hard origin/main
          push-branch test
          echo "test reset onto main"
          echo "aligned=true" >> "$GITHUB_OUTPUT"

      - name: Realign development onto main
        if: github.ref_name == 'main' && steps.reset-test.outputs.aligned == 'true'
        run: realign-development main

      # When test advances, realign development onto it so its base does not rot.
      # A main-path run that left test untouched realigns onto test for the same reason.
      # A manual run on development realigns it with this file from development, so a
      # fix to this workflow can unstick development before it reaches test.
      - name: Realign development onto test
        if: >-
          github.ref_name == 'test' || (github.ref_name == 'main' &&
          steps.reset-test.outputs.aligned == 'false') || (github.event_name == 'workflow_dispatch'
          && github.ref_name == 'development')
        run: realign-development test

      # Runs after the development realign so a diverged test still gets
      # development rebased onto it, then fails the run so a person sees it.
      - name: Fail on diverged test
        if: ${{ !cancelled() && steps.reset-test.outputs.diverged == 'true' }}
        run: |
          echo "::error::${{ github.repository }}: test is behind main and carries changes main lacks — resolve manually"
          exit 1
