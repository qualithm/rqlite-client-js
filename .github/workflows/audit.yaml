# Generated by dx/scripts/audit-sync from ci-templates/audit-bun.yaml.
# Do not edit directly — change the template and re-run audit-sync.

# Dependency overrides (package.json "overrides") freeze a transitive dep, and
# nothing ages a pin out on its own — `dx audit` detects advisories but never
# resolves versions. Record WHY each pin exists so a future reader can tell a
# security pin from a compatibility pin without PR archaeology: key the reason
# by package name in a top-level "//overrides" object (never a "// pkg" key
# inside "overrides" — npm reads that as a package and refuses to publish), e.g.
#   "overrides": { "sharp": "0.35.3" },
#   "//overrides": { "sharp": "security: miniflare pins 0.34.5 (libvips CVE); lift to 0.35.3" }
# Review pins periodically with `dx deps overrides` (from the dx repo): it marks
# each redundant (safe to delete) or still-needed. A pin that equals the latest
# published version is still-needed when deleting it would drop a dependent
# back onto a vulnerable version (sharp, above); verify a broken one by hand.
#
# An advisory is never skipped. When no bump or top-level override clears it,
# patch the dependency that blocks the override (`bun patch`) or replace that
# dependency; until then this job fails and its pm issue stays open.

name: Security Audit

# Advisory scans run daily; every job runs on Mondays and on a push that
# changes a dependency.
on:
  schedule:
    - cron: "0 6 * * 0,2-6" # Daily at 06:00 UTC, except Monday
    - cron: "0 6 * * 1" # Monday at 06:00 UTC: every job
  push:
    branches: [development, main]
    paths:
      - "bun.lock"
      - "package.json"
      - ".github/workflows/audit.yaml"
  workflow_dispatch: {}

# A newer push supersedes an older one; schedules queue apart from pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # bun audit reads bun.lock alone, so nothing is installed (qualithm/pm#3019).
      - name: Audit dependencies
        id: scan
        continue-on-error: true
        run: bun audit
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: bun audit found a vulnerability"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: bun audit found a vulnerability"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      # Every branch's whole history: a secret a later commit removed is still leaked.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          # Pinned release plus the sha256 of its linux_x64 tarball from the
          # release's checksums file. Bump both values together.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # gitleaks loads a committed .gitleaks.toml on its own, so its allowlist is
      # the only exemption. --verbose lists each finding's rule, file, line and
      # commit for triage, --redact masks the secret in it, and no report file is
      # written or uploaded.
      - name: Scan the history for secrets
        id: scan
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 --no-banner --log-opts=--all .
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: gitleaks found a leaked secret"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: gitleaks found a leaked secret"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
