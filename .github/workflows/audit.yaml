# Generated by dx/scripts/audit-sync from ci-templates/audit-bun.yaml.
# Do not edit directly — change the template and re-run audit-sync.

# Dependency overrides (package.json "overrides") freeze a transitive dep, and
# nothing ages a pin out on its own — `dx audit` detects advisories but never
# resolves versions. Record WHY each pin exists so a future reader can tell a
# security pin from a compatibility pin without PR archaeology: key the reason
# by package name in a top-level "//overrides" object (never a "// pkg" key
# inside "overrides" — npm reads that as a package and refuses to publish), e.g.
#   "overrides": { "sharp": "0.35.3" },
#   "//overrides": { "sharp": "security: miniflare pins 0.34.5 (libvips CVE); lift to 0.35.3" }
# Review pins periodically with `dx deps overrides` (from the dx repo): it marks
# each redundant (safe to delete) or still-needed. A pin that equals the latest
# published version is still-needed when deleting it would drop a dependent
# back onto a vulnerable version (sharp, above); verify a broken one by hand.
#
# An advisory that no bump or top-level override can clear may be skipped by
# listing its GHSA ID in a top-level "//auditIgnore" object. Each value names
# why it can't be fixed, the upstream issue that will unblock it, and a
# "review-by YYYY-MM-DD" date at most 90 days out, e.g.
#   "//auditIgnore": { "GHSA-xxxx-xxxx-xxxx": "typedoc needs minimatch 10; unblocked by TypeStrong/typedoc#3150; review-by 2027-02-01" }
# An entry past its review-by date, undated, or dated further out fails the job
# and is no longer skipped (qualithm/pm#3083).

name: Security Audit

# Advisory scans run daily; every job runs on Mondays and on a push that
# changes a dependency (qualithm/pm#3067).
on:
  schedule:
    - cron: "0 6 * * 0,2-6" # Daily at 06:00 UTC, except Monday
    - cron: "0 6 * * 1" # Monday at 06:00 UTC: every job
  push:
    branches: [development, main]
    paths:
      - "bun.lock"
      - "package.json"
      - ".github/workflows/audit.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Read advisory ignores from package.json
        id: ignores
        run: |
          bun -e '
            const pkg = await Bun.file("package.json").json();
            const entries = Object.entries(pkg["//auditIgnore"] ?? {});
            const today = new Date().toISOString().slice(0, 10);
            const limit = new Date(Date.now() + 90 * 864e5).toISOString().slice(0, 10);
            const ids = [];
            let stale = false;
            for (const [id, reason] of entries) {
              const date = /review-by (\d{4}-\d{2}-\d{2})/.exec(String(reason))?.[1];
              let problem = "";
              if (!/^GHSA(-[0-9a-z]{4}){3}$/.test(id)) problem = "is not a GHSA ID";
              else if (!date) problem = "has no review-by YYYY-MM-DD date";
              else if (date < today) problem = `passed its review-by date ${date}`;
              else if (date > limit) problem = `has a review-by date ${date} more than 90 days out`;
              if (problem) {
                console.log(`::error:://auditIgnore ${id} ${problem}: ${reason}`);
                stale = true;
              } else ids.push(id);
            }
            require("node:fs").appendFileSync(
              process.env.GITHUB_OUTPUT,
              `advisories=${ids.join(",")}\nstale=${stale}\n`,
            );
          '
      # bun audit reads bun.lock alone, so nothing is installed (qualithm/pm#3019).
      - name: Audit dependencies
        id: scan
        continue-on-error: true
        env:
          IGNORES: ${{ steps.ignores.outputs.advisories }}
          STALE: ${{ steps.ignores.outputs.stale }}
        run: |
          args=()
          IFS=, read -ra ids <<< "$IGNORES"
          for id in "${ids[@]}"; do args+=(--ignore "$id"); done
          status=0
          bun audit "${args[@]}" || status=1
          if [ "$STALE" = "true" ]; then status=1; fi
          exit "$status"
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: bun audit found a vulnerability"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: bun audit found a vulnerability"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
