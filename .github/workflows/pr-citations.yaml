# Generated by dx/scripts/pr-sync from pr-templates/pr-citations.yaml.
# Do not edit directly — change the template and re-run pr-sync.

name: Decision Citations

# Decision Citations is a required check: code, docs and config state a rule
# in words or point at code, and only issues cite a Decision, so a line the PR
# adds that cites one fails it. It reads only the lines the PR adds, so an
# untouched fixture never fails it.
#
# A workflow of its own, apart from refresh-pr.yaml, so it never runs on a
# retitle: a run skipped there would record a passing check over a failed one
# on the same commit (qualithm/pm#3015).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # A required check must report in the merge queue too; it skips there.
  merge_group:
    types: [checks_requested]

concurrency:
  group: pr-citations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  citations:
    name: Decision Citations
    # Merge-queue runs and promotion PRs (checked on their feature PRs) skip,
    # which bills nothing and still satisfies the required check: GitHub
    # reports a job skipped by its `if` as successful.
    if:
      github.event_name == 'pull_request' && !contains(fromJSON('["development", "test", "main"]'),
      github.head_ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Skip PRs that predate the vendored action
        id: vendored
        run:
          test -f .github/actions/refresh-pr/refresh-pr.js && echo "present=true" >>
          "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.vendored.outputs.present == 'true'
        with:
          bun-version: "1.4.4"

      - name: Check the added lines for Decision citations
        if: steps.vendored.outputs.present == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun .github/actions/refresh-pr/refresh-pr.js --check-citations "$BASE_REF"
