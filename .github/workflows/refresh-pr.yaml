# Generated by dx/scripts/pr-sync from pr-templates/refresh-pr.yaml.
# Do not edit directly — change the template and re-run pr-sync.

name: Refresh PR

# Regenerates an open feature PR's title/body from the live commit range on
# every push, so the reviewer-facing page never goes stale between `dx git
# feature` runs (dx#317, Decision qualithm/discussions#318). The synthesis is
# the vendored .github/actions/refresh-pr/git-pr-synthesize — the same code
# `dx git feature` runs locally — so both paths produce identical output.
on:
  pull_request:
    # `edited` is deliberately absent: this workflow's own `gh pr edit` fires
    # it, and it must never retrigger itself.
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  refresh:
    name: Refresh PR title/body
    # Promotion hops (development -> test -> main) are owned by `dx git merge`,
    # whose synthesis differs — never touch those PRs here.
    if:
      github.actor != 'github-actions[bot]' && !contains(fromJSON('["development", "test",
      "main"]'), github.head_ref)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Skip PRs that predate the vendored scripts
        id: vendored
        # The checkout is the PR HEAD: a branch opened before this workflow was
        # synced doesn't carry the scripts, and failing there would read as the
        # PR's own CI failing. Skip; the first push after rebasing refreshes it.
        run:
          test -f .github/actions/refresh-pr/refresh.sh && echo "present=true" >> "$GITHUB_OUTPUT"
          || echo "present=false" >> "$GITHUB_OUTPUT"

      - name: Install zsh
        if: steps.vendored.outputs.present == 'true'
        run: sudo apt-get install -y zsh

      - name: Refresh the PR title/body
        if: steps.vendored.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          .github/actions/refresh-pr/refresh.sh "${{ github.base_ref }}" "${{
          github.event.pull_request.number }}"
