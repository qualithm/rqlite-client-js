# Generated by dx/scripts/tag-sync from ci-templates/tag-on-release.yaml.
# Do not edit directly — change the template and re-run tag-sync.

name: Tag on Release

# Producer half of the tag-driven release flow. The release.yaml in each repo
# is the CONSUMER (triggered by `push: tags`); this workflow is the PRODUCER:
# it creates the tag on a commit that has landed on main.
#
# Trigger is `push: [main]`: the tag is cut once a commit lands on main. Every
# such commit already passed CI on its PR (CI runs on `pull_request` into
# main/test), so gating on a main CI run is unnecessary — and impossible, since
# CI has no `push: [main]` trigger. The version source of truth is the repo's
# manifest (package.json, npm or mip / pyproject.toml / Cargo.toml / tauri.conf.json / project.yml /
# library.properties / version.txt / VERSION / Directory.Build.props /
# gradle.properties); a push that
# does not change the version is a no-op because the tag already exists, so this
# is safe to run on every push to main.
#
# The tag MUST be pushed with the qualithm-ci App token, not GITHUB_TOKEN —
# tags pushed with GITHUB_TOKEN do not trigger downstream workflows, so
# release.yaml would never fire.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: tag-on-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Tag main when version changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_GH_APP_PRIVATE_KEY }}

      - name: Checkout main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # github.sha is the pushed main commit (or the branch tip on manual
          # dispatch). fetch-depth 0 + tags so we can detect an already-released
          # version.
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve intended tag from version source
        id: version
        run: |
          set -euo pipefail

          # Detect ecosystem by manifest. Order matters: Tauri carries BOTH a
          # package.json and a Cargo.toml, so it must be matched first.
          #
          # Tag prefix policy: Go MUST be v-prefixed (Go module semantics), and
          # Tauri and SwiftUI apps stay v-prefixed (their release.yaml triggers
          # on v*.*.*). JS, mip, Python, Rust, .NET, Arduino, Android, Kotlin, ESP-IDF and Swift packages are BARE
          # (X.Y.Z, no leading v), as SwiftPM expects. A SwiftUI app's version
          # is MARKETING_VERSION in its XcodeGen project.yml; a Swift package has
          # no version in Package.swift, so it keeps one in VERSION. An Arduino
          # library is matched before package.json, which a C++ repo may carry
          # for tooling; its idf_component.yml must mirror library.properties.
          if [[ -f src-tauri/tauri.conf.json ]]; then
            kind="tauri"
            version=$(jq -r '.version' src-tauri/tauri.conf.json)
            prefix="v"
          elif [[ -f project.yml ]]; then
            kind="swiftui"
            version=$(grep -E '^[[:space:]]*MARKETING_VERSION:' project.yml | head -1 \
              | sed -E 's/^[^:]*:[[:space:]]*["'"'"']?([^"'"'"'[:space:]#]+).*/\1/')
            prefix="v"
          elif [[ -f gradle.properties ]] && grep -qE '^versionName[[:space:]]*=' gradle.properties; then
            kind="android"
            version=$(sed -nE 's/^versionName[[:space:]]*=[[:space:]]*//p' gradle.properties | head -1 | tr -d '[:space:]')
            prefix=""
          elif [[ -f gradle.properties ]] && grep -qE '^version[[:space:]]*=' gradle.properties; then
            # A Kotlin library: Gradle sets the project's version from this line.
            kind="kotlin"
            version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -1 | tr -d '[:space:]')
            prefix=""
          elif [[ -f Cargo.toml ]]; then
            kind="rust"
            version=$(grep -E '^version[[:space:]]*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            prefix=""
          elif [[ -f Directory.Build.props ]] && grep -q '<Version>' Directory.Build.props; then
            kind="dotnet"
            version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
            prefix=""
          elif [[ -f library.properties ]]; then
            kind="arduino"
            version=$(sed -n 's/^version=//p' library.properties | head -1 | tr -d '[:space:]')
            prefix=""
            if [[ -f idf_component.yml ]]; then
              idf=$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]#]+)"?.*/\1/p' idf_component.yml | head -1)
              if [[ "$idf" != "$version" ]]; then
                echo "::error file=idf_component.yml::refusing to tag: version '${idf}' must equal library.properties version '${version}'"
                exit 1
              fi
            fi
          elif [[ -f package.json ]] && jq -e 'has("urls")' package.json >/dev/null; then
            # mip's manifest shares npm's filename. It is the one with `urls`
            # (npm's has no such key); a Bun lockfile or an npm dependency
            # block beside `urls` is ambiguous, so refuse it rather than guess.
            if [[ -f bun.lock || -f bun.lockb ]] \
              || jq -e 'has("dependencies") or has("devDependencies") or has("peerDependencies")' package.json >/dev/null; then
              echo "::error file=package.json::package.json has mip's urls and an npm or Bun marker (bun.lock, dependencies): keep one manifest"
              exit 1
            fi
            kind="micropython"
            version=$(jq -r '.version' package.json)
            prefix=""
            # A dual-runtime package releases its wheel and its mip package
            # from one tag, so the two versions must agree.
            if [[ -f pyproject.toml ]]; then
              # [project]'s version line; a pyproject.toml holding only dev
              # tools has none.
              wheel=$(awk '/^\[/ { p = ($0 == "[project]") } p && /^version[[:space:]]*=/ { sub(/^[^"]*"/, ""); sub(/".*$/, ""); print; exit }' pyproject.toml)
              if [[ -n "$wheel" && "$wheel" != "$version" ]]; then
                echo "::error file=pyproject.toml::pyproject.toml's version ${wheel} differs from package.json's ${version}: bump both together"
                exit 1
              fi
            fi
          elif [[ -f pyproject.toml ]] && awk '/^\[/ { p = ($0 == "[project]") } p && /^version[[:space:]]*=/ { found = 1 } END { exit !found }' pyproject.toml; then
            # A CPython package: [project]'s version line. Matched after mip,
            # so a dual-runtime package keeps its two-file check above.
            kind="python"
            version=$(awk '/^\[/ { p = ($0 == "[project]") } p && /^version[[:space:]]*=/ { sub(/^[^"]*"/, ""); sub(/".*$/, ""); print; exit }' pyproject.toml)
            prefix=""
          elif [[ -f package.json ]]; then
            kind="js"
            version=$(jq -r '.version' package.json)
            prefix=""
          elif [[ -f Package.swift && -f VERSION ]]; then
            kind="swift"
            version=$(tr -d '[:space:]' < VERSION)
            prefix=""
          elif [[ -f version.txt && -f CMakeLists.txt ]] && grep -q 'tools/cmake/project.cmake' CMakeLists.txt; then
            # An ESP-IDF firmware image: IDF reads version.txt into PROJECT_VER.
            kind="esp-idf"
            version=$(tr -d '[:space:]' < version.txt)
            prefix=""
          elif [[ -f VERSION ]]; then
            kind="go"
            version=$(tr -d '[:space:]' < VERSION)
            prefix="v"
          else
            echo "::error::no version source found (package.json / pyproject.toml / Cargo.toml / tauri.conf.json / project.yml / library.properties / version.txt / VERSION / Directory.Build.props / gradle.properties)"
            exit 1
          fi

          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::could not read a version from the ${kind} manifest"
            exit 1
          fi

          # 0.0.0 is the unreleased sentinel for freshly scaffolded template
          # repos — never cut a release for it.
          if [[ "$version" == "0.0.0" ]]; then
            echo "::notice::version is the 0.0.0 unreleased sentinel — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${prefix}${version}"
          {
            echo "kind=$kind"
            echo "version=$version"
            echo "tag=$tag"
            echo "prefix=$prefix"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::detected ${kind} version ${version} -> tag ${tag}"

      - name: Create and push tag if missing
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          KIND: ${{ steps.version.outputs.kind }}
          PREFIX: ${{ steps.version.outputs.prefix }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::notice::tag ${TAG} already exists — nothing to release"
            exit 0
          fi

          # Versions only move forward. A tag pushed by hand can leave the
          # manifest behind the newest release (millwright had v0.2.0 tagged
          # while VERSION still said 0.1.3); bumping that manifest would cut a
          # tag that sorts below the release consumers already have. Compare
          # against the highest plain X.Y.Z tag with this repo's prefix.
          # Prerelease versions are left to the person cutting them.
          version="${TAG#"$PREFIX"}"
          if [[ "$version" != *-* ]]; then
            highest=$(git tag -l "${PREFIX}[0-9]*" | sed "s/^${PREFIX}//" \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [[ -n "$highest" ]] \
              && [[ "$(printf '%s\n%s\n' "$version" "$highest" | sort -V | tail -1)" != "$version" ]]; then
              echo "::error::refusing to tag ${TAG}: it sorts below the existing ${PREFIX}${highest}. Bump the version past ${highest}."
              exit 1
            fi
          fi

          # A Go module must not be tagged while it builds against an untagged
          # commit of one of our own modules (a pseudo-version) or a local
          # replace: its consumers would inherit an unreleased dependency.
          # Release the dependency, require its tag, then bump VERSION again.
          if [[ "$KIND" == "go" && -f go.mod ]]; then
            bad=$(grep -nE '^[[:space:]]*(require[[:space:]]+)?github\.com/qualithm/[^[:space:]]+[[:space:]]+v[^[:space:]]*[0-9]{14}-[0-9a-f]{12}([[:space:]]|$)|^[[:space:]]*(replace[[:space:]]+)?github\.com/qualithm/.*=>[[:space:]]*\.' go.mod || true)
            if [[ -n "$bad" ]]; then
              echo "::error file=go.mod::refusing to tag ${TAG}: go.mod pins a qualithm module to an untagged commit or local path:"
              echo "$bad"
              exit 1
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Annotated tag on the current (main) commit. Pushing with the App
          # token fires release.yaml via its `push: tags` trigger.
          git tag -a "${TAG}" -m "release ${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "::notice::pushed tag ${TAG} on $(git rev-parse HEAD)"
