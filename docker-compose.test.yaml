services:
  rqlite:
    image: rqlite/rqlite:10.5.0@sha256:7edf5fb02a42c63c648c2fc121894e1b74320db5f0fe6032d6a4f052ee0b666f
    ports:
      - "4001:4001"
      - "4002:4002"
    command: >
      -node-id=1 -http-addr=0.0.0.0:4001 -raft-addr=0.0.0.0:4002
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4001/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
