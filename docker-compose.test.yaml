services:
  rqlite:
    image: rqlite/rqlite:10.6.4@sha256:f9a1d17e4e0589c9ed9eee88f9cacb8eb45dc645bcd12051d00b1e6111035226
    ports:
      - "4001:4001"
      - "4002:4002"
    command: >
      -node-id=1 -http-addr=0.0.0.0:4001 -raft-addr=0.0.0.0:4002
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4001/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
