services:
  rqlite:
    image: rqlite/rqlite:10.6.6@sha256:e98baaf915dcbb0abb43f6ef0c1ba7c1dc35efb3d0e63ecd42f313f7fecb7f0d
    ports:
      - "4001:4001"
      - "4002:4002"
    command: >
      -node-id=1 -http-addr=0.0.0.0:4001 -raft-addr=0.0.0.0:4002
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4001/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
